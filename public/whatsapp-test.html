<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Test - JamRoom</title>
    
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/pages/whatsapp-test.css">

</head>
<body>
    <div class="test-container">
        <div class="header">
            <h1>📱 WhatsApp Test</h1>
            <p>WhatsApp notifications are currently disabled</p>
        </div>

        <form id="testForm">
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input 
                    type="tel" 
                    id="mobile" 
                    name="mobile" 
                    placeholder="+91XXXXXXXXXX" 
                    value=""
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Test Message (Optional)</label>
                <textarea 
                    id="message" 
                    name="message" 
                    rows="4" 
                    placeholder="Leave empty for default test message"
                ></textarea>
            </div>

            <button type="submit" class="btn" id="sendBtn" disabled>
                WhatsApp Disabled
            </button>

            <button type="button" class="btn btn-secondary" id="configBtn" disabled>
                Configuration Disabled
            </button>

            <button type="button" class="btn btn-accent" id="dummyBookingBtn" disabled>
                🧪 Booking Notifications Disabled
            </button>
        </form>

        <div id="result" class="result"></div>

        <div id="configInfo" class="config-info is-hidden"></div>

        <div class="setup-steps">
            <h3>WhatsApp Status</h3>
            <ol>
                <li>All WhatsApp provider integrations are intentionally disabled.</li>
                <li>No WhatsApp test messages or booking notifications will be sent.</li>
                <li>Re-enable later when provider configuration is finalized.</li>
            </ol>
        </div>

        <div class="back-link">
            <a href="/">&larr; Back to Home</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const testForm = document.getElementById('testForm');
        const configBtn = document.getElementById('configBtn');
        const dummyBookingBtn = document.getElementById('dummyBookingBtn');
        const sendBtn = document.getElementById('sendBtn');
        const resultDiv = document.getElementById('result');
        const configInfoDiv = document.getElementById('configInfo');

        function showResult(message, isSuccess) {
            resultDiv.style.display = 'block';
            resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = message;
        }

        // WhatsApp test controls are disabled intentionally.
        testForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showResult('WhatsApp notifications are disabled in this environment.', false);
        });

        // Check configuration
        configBtn.addEventListener('click', async () => {
            showResult('WhatsApp provider configuration is disabled.', false);
        });

        // Auto-check configuration on page load
        window.addEventListener('load', () => {
            showResult('WhatsApp notifications are disabled. Re-enable later when needed.', false);
        });

        // Test dummy booking notifications
        dummyBookingBtn.addEventListener('click', async () => {
            showResult('Booking-related WhatsApp notifications are disabled.', false);
        });
    </script>
</body>
</html>
